openapi: "3.1.0"
info:
  title: Peak 10 Energy — Document AI API
  description: |
    Universal Data Governance & Document AI system.
    Pillar 3 of the Peak 10 Enterprise Automation platform.

    Classifies documents, generates standardized names, and recommends
    filing locations within the governed SharePoint hierarchy.
  version: "1.0.0"
servers:
  - url: https://{functionApp}.azurewebsites.net/api
    variables:
      functionApp:
        default: peak10-document-ai
  - url: http://localhost:7072/api
    description: Local development

paths:
  /documents:
    get:
      operationId: listDocuments
      summary: List recent staged documents
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Optional staged document status filter
        - name: source
          in: query
          required: false
          schema:
            type: string
          description: Optional source filter such as upload, email, pillar1, or pillar4
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: Recent staged documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  documents:
                    type: array
                    items:
                      $ref: "#/components/schemas/StagedDocument"

  /documents/stage:
    post:
      operationId: stageDocument
      summary: Stage a new document for classification
      description: |
        Accepts documents from any source: direct upload, email attachment
        (from Pillar 2), payment schedule (from Pillar 1), or expense
        receipt (from Pillar 4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageRequest"
      responses:
        "201":
          description: Document staged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageResponse"

  /documents/classify:
    post:
      operationId: classifyDocument
      summary: Classify a staged document
      description: |
        Runs the two-tier classification pipeline (rules → AI) and
        returns both the classification result and a filing recommendation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassifyRequest"
      responses:
        "200":
          description: Classification complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassifyResponse"

  /documents/file:
    post:
      operationId: fileDocument
      summary: Confirm filing of a classified document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_id]
              properties:
                document_id:
                  type: string
                confirmed_path:
                  type: string
                  description: Override the recommended path
                confirmed_name:
                  type: string
                  description: Override the standardized name
      responses:
        "200":
          description: Document filed

  /documents/correct:
    post:
      operationId: correctClassification
      summary: Log a user correction to classification
      description: |
        Records user overrides for the continuous learning loop.
        Corrections feed the RAG knowledge base, not model fine-tuning.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorrectionRequest"
      responses:
        "200":
          description: Correction logged

  /documents/{document_id}:
    get:
      operationId: getDocument
      summary: Get document status and classification
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document details
        "404":
          description: Not found

  /database-updates/propose:
    post:
      operationId: proposeDatabaseUpdate
      summary: Queue a proposed internal database update from a staged document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabaseUpdateProposeRequest"
      responses:
        "201":
          description: Proposal created
        "200":
          description: Existing pending proposal returned

  /database-updates:
    get:
      operationId: listDatabaseUpdates
      summary: List queued internal database updates
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending_approval, approved, rejected]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: Queue results

  /database-updates/{update_id}:
    get:
      operationId: getDatabaseUpdate
      summary: Get one internal database update proposal
      parameters:
        - name: update_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Proposal details
        "404":
          description: Not found

  /database-updates/review:
    post:
      operationId: reviewDatabaseUpdate
      summary: Approve or reject an internal database update proposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabaseUpdateReviewRequest"
      responses:
        "200":
          description: Proposal reviewed

  /database-updates/apply:
    post:
      operationId: applyDatabaseUpdate
      summary: Apply an approved internal database update (shadow or active mode)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabaseUpdateApplyRequest"
      responses:
        "200":
          description: Applied or shadow-applied
        "503":
          description: Apply failed

  /database-updates/metrics/learning:
    get:
      operationId: getDatabaseUpdateLearningEval
      summary: Summarize review/apply learning signals and guardrail metrics
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5000
      responses:
        "200":
          description: Learning evaluation summary

  /health:
    get:
      operationId: healthCheck
      summary: Health check
      responses:
        "200":
          description: Service healthy

components:
  schemas:
    StageRequest:
      type: object
      required: [filename]
      properties:
        document_id:
          type: string
          description: Optional caller-provided ID to support idempotent staging across pillars
          pattern: "^[A-Za-z0-9._:-]{1,200}$"
        filename:
          type: string
        source:
          type: string
          enum: [upload, email, pillar1, pillar4]
          default: upload
        source_detail:
          type: string
          description: E.g., email subject line or Pillar 1 run_id
        source_metadata:
          type: object
          description: Optional upstream linkage metadata such as message_id, attachment_id, sender, or thread keys
        content_text:
          type: string
          description: Optional extracted text used for content-first classification and version-state detection
        file_size_bytes:
          type: integer
        content_hash:
          type: string
        content_type:
          type: string
          description: MIME type for uploaded bytes
        file_bytes_base64:
          type: string
          description: Optional base64-encoded document payload to stage for later filing
        classification:
          $ref: "#/components/schemas/ClassificationResult"
        filing:
          $ref: "#/components/schemas/FilingRecommendation"
        extraction:
          type: object
          description: Optional upstream extraction summary/details from another pillar

    StageResponse:
      type: object
      properties:
        success:
          type: boolean
        document:
          $ref: "#/components/schemas/StagedDocument"
        database_update:
          oneOf:
            - $ref: "#/components/schemas/DatabaseUpdateProposal"
            - type: "null"
        database_update_created:
          type: boolean
        database_update_reason:
          type: string

    ClassifyRequest:
      type: object
      required: [filename]
      properties:
        document_id:
          type: string
        filename:
          type: string
        content_text:
          type: string
          description: Extracted text from the document (for AI classification)
        ai_response:
          type: object
          description: Pre-computed AI classification (if available)

    ClassifyResponse:
      type: object
      properties:
        success:
          type: boolean
        classification:
          $ref: "#/components/schemas/ClassificationResult"
        filing:
          $ref: "#/components/schemas/FilingRecommendation"
        needs_ai_classification:
          type: boolean
          description: True if rule-based confidence was low and AI should be called
        ai_prompt:
          type: string
          description: The prompt to send to Azure OpenAI (only if needs_ai_classification)
        database_update:
          oneOf:
            - $ref: "#/components/schemas/DatabaseUpdateProposal"
            - type: "null"

    CorrectionRequest:
      type: object
      required: [document_id, corrected_type]
      properties:
        document_id:
          type: string
        corrected_type:
          type: string
          description: The correct document type
        corrected_path:
          type: string
          description: The correct filing path
        notes:
          type: string

    StagedDocument:
      type: object
      properties:
        document_id:
          type: string
        original_filename:
          type: string
        file_extension:
          type: string
        source:
          type: string
        source_detail:
          type: string
        source_metadata:
          type: object
        staged_at:
          type: string
          format: date-time
        file_size_bytes:
          type: integer
        content_hash:
          type: string
        content_type:
          type: string
        binary_available:
          type: boolean
        storage_backend:
          type: string
        storage_reference:
          type: string
        status:
          type: string
          enum: [pending, classified, filed, error]
        extraction:
          type: object
        filed_at:
          type: string
          format: date-time
        filing_backend:
          type: string
        filing_reference:
          type: string
        classification:
          $ref: "#/components/schemas/ClassificationResult"
        filing:
          $ref: "#/components/schemas/FilingRecommendation"

    ClassificationResult:
      type: object
      properties:
        document_type:
          type: string
        confidence:
          type: number
        confidence_level:
          type: string
          enum: [high, medium, low]
        metadata:
          $ref: "#/components/schemas/ExtractedMetadata"
        reasoning:
          type: string

    FilingRecommendation:
      type: object
      properties:
        recommended_path:
          type: string
          description: "E.g., 01_CORPORATE/Finance/AP"
        standardized_name:
          type: string
          description: "E.g., 2026-03-14_Invoice_Halliburton_INV-2026-0412.pdf"
        document_type:
          type: string
        confidence_level:
          type: string
        requires_review:
          type: boolean
        alternative_paths:
          type: array
          items:
            type: string

    ExtractedMetadata:
      type: object
      properties:
        vendor_name:
          type: string
        counterparty:
          type: string
        effective_date:
          type: string
        expiration_date:
          type: string
        amount:
          type: string
        well_name:
          type: string
        lease_name:
          type: string
        county:
          type: string
        state:
          type: string
        reference_number:
          type: string

    DatabaseUpdateProposal:
      type: object
      properties:
        update_id:
          type: string
        document_id:
          type: string
        document_type:
          type: string
        version_status:
          type: string
          enum: [final, wip, unknown]
        target_table:
          type: string
        operation:
          type: string
        proposed_field_updates:
          type: object
        approved_field_updates:
          type: object
        effective_field_updates:
          type: object
        confidence:
          type: number
        trust_score:
          type: number
        policy_checks:
          type: object
        status:
          type: string
          enum: [pending_approval, approved, rejected]
        apply_state:
          type: string
          enum: [pending, shadow_applied, applied, apply_failed]
        apply_mode:
          type: string
          enum: [shadow, active]
        applied_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        apply_reference:
          type: string
        apply_error:
          type: string
        proposed_at:
          type: string
          format: date-time
        reviewed_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        reviewed_by:
          type: string
        review_notes:
          type: string
        source_summary:
          type: object

    DatabaseUpdateProposeRequest:
      type: object
      required: [document_id]
      properties:
        document_id:
          type: string
        force:
          type: boolean
          description: Force creation of a new pending proposal even if one already exists

    DatabaseUpdateReviewRequest:
      type: object
      required: [update_id, decision]
      properties:
        update_id:
          type: string
        decision:
          type: string
          enum: [approve, reject]
        reviewed_by:
          type: string
        review_notes:
          type: string
        edited_field_updates:
          type: object
          description: Optional owner-edited values to apply when approving

    DatabaseUpdateApplyRequest:
      type: object
      required: [update_id]
      properties:
        update_id:
          type: string
        applied_by:
          type: string
        apply_notes:
          type: string

    LearningEvidence:
      type: object
      properties:
        evidence_id:
          type: string
        update_id:
          type: string
        document_id:
          type: string
        document_type:
          type: string
        target_table:
          type: string
        event_type:
          type: string
          enum: [review, apply]
        decision:
          type: string
        trust_score:
          type: number
        proposed_field_updates:
          type: object
        final_field_updates:
          type: object
        edited_fields:
          type: array
          items:
            type: string
        actor:
          type: string
        notes:
          type: string
        apply_mode:
          type: string
        outcome:
          type: string
        captured_at:
          type: string
          format: date-time

    # -----------------------------------------------------------------
    # Inter-Pillar Integration Contracts
    # -----------------------------------------------------------------

    Pillar1FilingRequest:
      description: |
        Contract for payment schedules/ACH exports pushed FROM Pillar 1
        INTO the Document AI staging queue for auto-naming and filing.
      type: object
      required: [document_type, document_name, content_url, metadata]
      properties:
        document_type:
          type: string
          enum: [payment_schedule, ach_export]
        document_name:
          type: string
        content_url:
          type: string
        metadata:
          type: object
          properties:
            run_id:
              type: string
            total_allocated:
              type: string
            vendor_count:
              type: integer

    Pillar2EmailAttachment:
      description: |
        Contract for email attachments routed FROM Pillar 2 (Email
        Intelligence) INTO the Document AI staging queue.
      type: object
      required: [filename, email_subject, sender]
      properties:
        filename:
          type: string
        email_subject:
          type: string
        sender:
          type: string
        received_at:
          type: string
          format: date-time
        attachment_url:
          type: string
          description: Blob storage URL of the extracted attachment
